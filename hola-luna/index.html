<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Hola Luna! 🐶</title>
<meta name="description" content="Una demo muy seria preparada especialmente para Luna.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="¡Hola Luna! 🐶">
<meta property="og:description" content="Demo exclusiva. Contiene perro bailando.">
<meta name="theme-color" content="#1B1035">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐶%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#1B1035;--ink:#FFF7E8;--pink:#FF5FA2;--yellow:#FFD23F;--cyan:#3FE0D0;--violet:#8F87E6;--dog:#E8A85C;--dog-dark:#B9742E}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif;overflow-x:hidden;
       display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;min-height:100%}
  /* luces de discoteca */
  .disco{position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(circle at 20% 30%,#FF5FA233 0,transparent 35%),radial-gradient(circle at 80% 25%,#3FE0D033 0,transparent 35%),radial-gradient(circle at 50% 85%,#FFD23F2e 0,transparent 40%);
    animation:luces 2.4s steps(1) infinite}
  @keyframes luces{33%{filter:hue-rotate(120deg)}66%{filter:hue-rotate(240deg)}}
  main{position:relative;z-index:1;max-width:560px;width:100%}
  .tag{display:inline-block;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;background:#ffffff1a;padding:.35rem .8rem;border-radius:99px}
  h1{font-size:clamp(3rem,15vw,6rem);line-height:1;margin:.6rem 0 .7rem;color:var(--yellow);text-shadow:4px 4px 0 var(--pink);animation:latido .48s ease-in-out infinite alternate}
  @keyframes latido{to{transform:scale(1.06) rotate(-2deg)}}
  .sub{font-size:1.15rem;margin:0 0 .5rem;opacity:.9}
  /* perro */
  .escena{position:relative;width:min(320px,85vw);margin:0 auto}
  .perro{width:100%;height:auto;overflow:visible}
  .salta{animation:salta .48s ease-in-out infinite alternate;transform-origin:150px 260px}
  @keyframes salta{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-18px) rotate(6deg)}}
  .cola{animation:cola .16s ease-in-out infinite alternate;transform-origin:212px 170px}
  @keyframes cola{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
  .pata-a{animation:pata .48s ease-in-out infinite alternate;transform-origin:120px 200px}
  .pata-b{animation:pata .48s ease-in-out infinite alternate-reverse;transform-origin:180px 200px}
  @keyframes pata{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
  .brazo-a{animation:brazo .48s ease-in-out infinite alternate;transform-origin:112px 150px}
  .brazo-b{animation:brazo .48s ease-in-out infinite alternate-reverse;transform-origin:188px 150px}
  @keyframes brazo{from{transform:rotate(-60deg)}to{transform:rotate(40deg)}}
  .oreja{animation:oreja .24s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}
  @keyframes oreja{to{transform:rotate(14deg)}}
  .lengua{animation:lengua .3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}
  @keyframes lengua{to{transform:scaleY(1.3)}}
  .gafas{animation:gafas 1.9s ease-in-out infinite}
  @keyframes gafas{0%,70%{transform:translateY(0)}80%{transform:translateY(-6px)}100%{transform:translateY(0)}}
  .nota{position:absolute;font-size:1.8rem;animation:nota 2.4s linear infinite;opacity:0}
  .nota:nth-child(2){left:6%;top:30%;animation-delay:.4s}
  .nota:nth-child(3){right:4%;top:20%;animation-delay:1.1s}
  .nota:nth-child(4){left:14%;top:6%;animation-delay:1.7s}
  .nota:nth-child(5){right:12%;top:52%;animation-delay:.8s}
  @keyframes nota{0%{opacity:0;transform:translateY(20px) rotate(-10deg)}20%{opacity:1}100%{opacity:0;transform:translateY(-70px) rotate(20deg)}}
  .suelo{width:70%;height:14px;margin:-6px auto 0;border-radius:50%;background:#0006;animation:sombra .48s ease-in-out infinite alternate}
  @keyframes sombra{to{transform:scaleX(.8);opacity:.6}}
  .msg{margin:1.3rem auto 0;font-size:1.05rem;line-height:1.5;max-width:30em;background:#ffffff12;border-radius:18px;padding:1rem 1.2rem}
  button{margin-top:1.1rem;font:inherit;font-weight:700;font-size:1.05rem;border:0;border-radius:99px;padding:.85rem 1.4rem;cursor:pointer;
         background:var(--pink);color:#fff;box-shadow:0 5px 0 #b8336d;transition:transform .1s}
  button:active{transform:translateY(4px);box-shadow:0 1px 0 #b8336d}
  .pie{margin-top:1.4rem;font-size:.8rem;opacity:.6}
  .confeti{position:fixed;top:-20px;width:10px;height:14px;z-index:2;pointer-events:none;animation:cae linear forwards}
  @keyframes cae{to{transform:translateY(110vh) rotate(720deg)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:2s!important}}
</style>
</head>
<body>
<div class="disco" aria-hidden="true"></div>
<main>
  <span class="tag">Demo exclusiva · v1.0</span>
  <h1>¡Hola Luna!</h1>
  <p class="sub">Esta web tiene un único objetivo: que sonrías.</p>

  <div class="escena" aria-hidden="true">
    <span class="nota">🎵</span><span class="nota">🎶</span><span class="nota">✨</span><span class="nota">🎵</span>
    <svg class="perro" viewBox="0 0 300 290" role="img" aria-label="Un perro con gafas de sol bailando">
      <g class="salta">
        <!-- cola -->
        <g class="cola"><path d="M205 175 Q250 150 240 110" fill="none" stroke="var(--dog-dark)" stroke-width="14" stroke-linecap="round"/></g>
        <!-- patas -->
        <g class="pata-a"><rect x="108" y="196" width="24" height="62" rx="12" fill="var(--dog-dark)"/><ellipse cx="118" cy="258" rx="18" ry="10" fill="#fff"/></g>
        <g class="pata-b"><rect x="168" y="196" width="24" height="62" rx="12" fill="var(--dog-dark)"/><ellipse cx="182" cy="258" rx="18" ry="10" fill="#fff"/></g>
        <!-- cuerpo -->
        <ellipse cx="150" cy="170" rx="62" ry="52" fill="var(--dog)"/>
        <ellipse cx="150" cy="182" rx="34" ry="32" fill="#F6D7A7"/>
        <!-- brazos -->
        <g class="brazo-a"><rect x="76" y="140" width="44" height="20" rx="10" fill="var(--dog)"/><circle cx="76" cy="150" r="12" fill="#fff"/></g>
        <g class="brazo-b"><rect x="180" y="140" width="44" height="20" rx="10" fill="var(--dog)"/><circle cx="224" cy="150" r="12" fill="#fff"/></g>
        <!-- cabeza -->
        <path class="oreja" d="M98 48 q-26 30 -8 74 q18 -8 26 -40z" fill="var(--dog-dark)"/>
        <path class="oreja" d="M202 48 q26 30 8 74 q-18 -8 -26 -40z" fill="var(--dog-dark)"/>
        <circle cx="150" cy="78" r="56" fill="var(--dog)"/>
        <ellipse cx="150" cy="98" rx="30" ry="22" fill="#F6D7A7"/>
        <ellipse cx="150" cy="86" rx="11" ry="8" fill="#2A1B12"/>
        <path d="M138 100 q12 12 24 0" fill="none" stroke="#2A1B12" stroke-width="4" stroke-linecap="round"/>
        <rect class="lengua" x="143" y="104" width="14" height="16" rx="7" fill="var(--pink)"/>
        <!-- pajarita -->
        <path d="M150 138 l-22 -12 v24z M150 138 l22 -12 v24z" fill="var(--pink)"/><circle cx="150" cy="138" r="6" fill="var(--yellow)"/>
        <!-- gafas de sol -->
        <g class="gafas">
          <rect x="108" y="54" width="36" height="22" rx="8" fill="#111"/><rect x="156" y="54" width="36" height="22" rx="8" fill="#111"/>
          <rect x="142" y="60" width="16" height="5" fill="#111"/>
          <rect x="114" y="58" width="10" height="5" rx="2" fill="#ffffff88"/><rect x="162" y="58" width="10" height="5" rx="2" fill="#ffffff88"/>
        </g>
        <!-- gorro de fiesta -->
        <path d="M150 -6 L128 30 h44z" fill="var(--cyan)"/><circle cx="150" cy="-8" r="7" fill="var(--yellow)"/>
        <path d="M137 18 h26 M132 26 h36" stroke="var(--pink)" stroke-width="4"/>
      </g>
    </svg>
    <div class="suelo"></div>
  </div>

  <p class="msg">Después de un análisis muy profesional hemos concluido que lo que le faltaba a internet era <b>un perro bailando para ti</b>. Ya está solucionado. De nada 😎</p>
  <button type="button" id="fiesta">Pulsa aquí si eres Luna 🎉</button>
  <p class="pie">Hecho con cariño por Ivan · 0 € · sin mantenimiento</p>
</main>
<script>
  (function () {
    var colores = ['#FF5FA2', '#FFD23F', '#3FE0D0', '#8F87E6', '#FFF7E8'];
    function confeti(n) {
      for (var i = 0; i < n; i++) {
        var c = document.createElement('i');
        c.className = 'confeti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colores[i % colores.length];
        c.style.animationDuration = 2 + Math.random() * 2.5 + 's';
        c.style.animationDelay = Math.random() * .6 + 's';
        document.body.appendChild(c);
        setTimeout(function (el) { el.remove(); }, 5500, c);
      }
    }
    var frases = ['¡Más fuerte! 🎉', '¡Otra vez! 🕺', 'El perro está muy orgulloso de ti 🐶', '¡Fiesta total! 🪩', 'Vale, ya puedes parar 😂'];
    var k = 0, b = document.getElementById('fiesta');
    b.addEventListener('click', function () { confeti(90); b.textContent = frases[k++ % frases.length]; });
    setTimeout(function () { confeti(60); }, 500);
  })();
</script>
</body>
</html>
